<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIOStreams</title>
    <meta name="description" content="The all in one addon for Stremio." />
    <meta name="apple-mobile-web-app-title" content="AIOStreams" />
    <meta name="theme-color" content="#070707" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon0.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // The desktop app draws its player beneath its web view, which only
      // renders transparency properly for a page transparent from the start.
      if (
        window.jmpInfo &&
        /^\/jellyfin(\/.*)?\/web(\/(index\.html)?)?$/i.test(location.pathname)
      )
        document.documentElement.classList.add('see-through');
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
