[package]
name = "aiostreams-native-android"
description = "The Android app's native library: every Rust feature behind JNI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aiostreams_native"
crate-type = ["cdylib"]

[features]
thumbs = ["dep:aiostreams-thumbs"]

[dependencies]
aiostreams-container.workspace = true
aiostreams-thumbs = { workspace = true, optional = true }
jni.workspace = true
serde_json.workspace = true
