# The licences of the Rust crates in the Android app's native library, for `cargo about generate`.
# Listed in order of preference, so a crate offering several is listed under MIT.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "IJG",
]
# The Android app's ABIs.
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The crates of this workspace, which are not published.
[private]
ignore = true
