[versions]
android-gradle = "9.4.1"
android-compileSdk = "37"
android-compileSdkMinor = "2"
android-minSdk = "29"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-media3 = "1.11.1"
androidx-webkit = "1.15.0"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
mpv-android-lib = "0.1.12"

[libraries]
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-gradle" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "androidx-media3" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "androidx-media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "androidx-media3" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
mpv-android-lib = { module = "io.github.abdallahmehiz:mpv-android-lib", version.ref = "mpv-android-lib" }
