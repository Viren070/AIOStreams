[package]
name = "aiostreams-native-android"
description = "The Android app's native library: every Rust feature behind JNI"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "aiostreams_native"
crate-type = ["cdylib"]

[dependencies]
aiostreams-container = { git = "https://github.com/AIOStreams/media", rev = "87dee2ccd7c39aa9baf1e739292e14fa9f0d8ec7" }
aiostreams-thumbs = { git = "https://github.com/AIOStreams/media", rev = "87dee2ccd7c39aa9baf1e739292e14fa9f0d8ec7" }
jni = "0.21"
log = "0.4"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
