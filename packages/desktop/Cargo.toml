[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
aiostreams-desktop-core = { path = "core" }
libloading = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
tao = "0.37"
wry = "0.57"
windows-sys = "0.61"

[profile.release]
lto = true
codegen-units = 1
strip = true
