# mpv options for AIOStreams, read on every start. Scripts, shaders and
# input.conf in this folder work as in mpv; keys the app does not use are
# passed to input.conf. See https://mpv.io/manual/stable/
#
# The app keeps a few options fixed so it can drive playback: idle,
# keep-open, force-window, osc, osd-bar, ytdl and the default key bindings.
#
# profile=high-quality
# hwdec=auto
# alang=jpn,eng
# slang=eng
