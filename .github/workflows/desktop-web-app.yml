name: Desktop Web App

# The web app's commits count towards AIOStreams' releases, not the desktop app's
# that bundles it. This keeps a pull request open that moves web-app.lock forward
# with their conventional commits in its message, so merging it lets release-please
# cut a desktop release that lists them.
on:
  push:
    branches: [main]
    paths:
      - 'packages/jellyfin-web/**'
      - 'packages/ui/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-web-app
  cancel-in-progress: true

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # A token of its own lets the pull request run CI, as release-please's do.
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      BRANCH: desktop/web-app
      LOCK: packages/desktop/web-app.lock
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: List the web app's changes
        id: changes
        run: |
          # Since the last merged update, or the last desktop release if that is newer.
          base=$(git log -1 --format=%H -- "$LOCK")
          tag=$(git describe --tags --abbrev=0 --match 'desktop-v*' 2>/dev/null || true)
          if [ -n "$tag" ] && git merge-base --is-ancestor "$base" "$tag"; then
            base=$tag
          fi
          # A commit that also touched the desktop app already counts towards its release.
          for commit in $(git log --reverse --format=%H "$base..HEAD" -- packages/jellyfin-web packages/ui); do
            git diff-tree --no-commit-id --name-only -r "$commit" | grep -q '^packages/desktop/' && continue
            git log -1 --format=%s "$commit"
          done | grep -E '^[a-z]+(\([^)]*\))?!?: ' >changes.txt || true
          echo "count=$(wc -l <changes.txt)" >>"$GITHUB_OUTPUT"
          cat changes.txt

      - name: Open or update the pull request
        if: steps.changes.outputs.count != '0'
        run: |
          title='chore(desktop): update the web app'
          {
            echo "The web app's changes since the desktop app last took it, for the desktop changelog."
            echo
            # release-please reads each of these as a commit of its own.
            sed 's/$/\n/' changes.txt
          } >message.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          head -2 "$LOCK" >lock.tmp
          git rev-parse HEAD >>lock.tmp
          mv lock.tmp "$LOCK"
          git commit -q -F <(printf '%s\n\n' "$title"; cat message.txt) -- "$LOCK"
          git push -q --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file message.txt
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file message.txt
          fi
