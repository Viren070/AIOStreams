name: Desktop Nightly

on:
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - '!packages/desktop/web-app.lock'
      - '!packages/desktop/README.md'
      - '!packages/desktop/CHANGELOG.md'
      - '!packages/desktop/linux/screenshots/**'
      - 'packages/jellyfin-web/**'
      - 'packages/ui/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: Which apps to build
        type: choice
        options: [all, windows, macos, linux]
        default: all

permissions:
  contents: write

# A newer push replaces a nightly still building. A release commit builds nothing, so it
# runs in a group of its own instead of cancelling one.
concurrency:
  group: "${{ startsWith(github.event.head_commit.message, 'chore(desktop): release ') && format('desktop-nightly-skip-{0}', github.run_id) || 'desktop-nightly' }}"
  cancel-in-progress: true

jobs:
  version:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(desktop): release ') }}"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Ahead of the last release, so a nightly always updates past it.
      - id: version
        run: |
          current=$(jq -r '."packages/desktop"' .release-please-manifest.json)
          IFS=. read -r major minor patch <<< "$current"
          echo "version=$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: nightly
      platforms: ${{ inputs.platforms || 'all' }}
