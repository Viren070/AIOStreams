name: TV Check

# Packages the TV apps when their packaging changes. A manual run leaves both
# packages on the run as artifacts.
on:
  pull_request:
    paths: &tv
      - 'packages/tv/**'
      - '!packages/tv/**/*.md'
      - '.github/workflows/tv-*.yml'
  push:
    branches: [main]
    paths: *tv
  workflow_dispatch:

concurrency:
  group: tv-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(tv): release ') }}"
    uses: ./.github/workflows/tv-build.yml
