name: Desktop Check

on:
  pull_request:
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/desktop-*.yml'
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
  workflow_dispatch:

# A newer push replaces a check still running on the same branch.
concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 4 and WebKitGTK 6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # about.toml names the packaged targets, so one runner checks them all.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-about@0.9.2
      - name: Check the crates' licences
        if: runner.os == 'Linux'
        run: cargo about generate about.hbs -o third-party-licenses.html
