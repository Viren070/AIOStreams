name: Desktop Check

on:
  pull_request:
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/desktop-*.yml'
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v6
      - name: Install GTK 4 and WebKitGTK 6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Windows'
        with:
          tool: cargo-about@0.9.2
      - name: Check the crates' licences
        if: runner.os == 'Windows'
        run: cargo about generate about.hbs -o third-party-licenses.html
