name: Desktop Build

# Builds, packs and publishes the desktop app for each architecture. A channel's
# feed lives on one release that every build replaces, so the app always finds it
# at the same address.
on:
  workflow_call:
    inputs:
      version:
        description: SemVer for this build
        required: true
        type: string
      channel:
        description: stable or nightly
        required: true
        type: string
      release:
        description: Versioned release to attach the installers to, if any
        required: false
        type: string
        default: ''
      platforms:
        description: all, windows or macos
        required: false
        type: string
        default: all

env:
  VPK_VERSION: 1.2.158

jobs:
  # The page every build ships, built once.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@aiostreams/jellyfin-web..."
      - run: pnpm -F @aiostreams/jellyfin-web build:standalone
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: packages/jellyfin-web/dist-standalone
          retention-days: 1

  # The Rust crates' licences, a page per target, made once for every build;
  # cargo-about fails on a licence that about.toml does not accept.
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Only Cargo's downloads: cargo-about reads the crates, it builds nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
          cache-targets: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - working-directory: packages/desktop
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          targets=()
          if [ "$PLATFORMS" != macos ]; then
            targets+=(x86_64-pc-windows-msvc aarch64-pc-windows-msvc)
          fi
          if [ "$PLATFORMS" != windows ]; then
            targets+=(aarch64-apple-darwin x86_64-apple-darwin)
          fi
          mkdir -p licences
          for target in "${targets[@]}"; do
            cargo about generate --config about.toml --target "$target" \
              about.hbs -o "licences/$target.html"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: licences
          path: packages/desktop/licences
          retention-days: 1

  # The release the builds publish to, with notes on what to download.
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      FEED: ${{ inputs.channel == 'nightly' && 'desktop-nightly' || 'desktop' }}
      TITLE: ${{ inputs.channel == 'nightly' && 'Desktop app, nightly' || 'Desktop app' }}
      SUFFIX: ${{ inputs.channel == 'nightly' && '-nightly' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/desktop/feed-release.md
          sparse-checkout-cone-mode: false
      - run: |
          # Each build replaces its files under the same names, so the links stay good.
          base="https://github.com/${{ github.repository }}/releases/download/$FEED"
          sed -e "s|@BASE@|$base|g" -e "s|@SUFFIX@|$SUFFIX|g" packages/desktop/feed-release.md >notes.md
          if gh release view "$FEED" >/dev/null 2>&1; then
            gh release edit "$FEED" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$FEED" --prerelease --latest=false --title "$TITLE" --notes-file notes.md
          fi

  build:
    name: build (Windows ${{ matrix.arch }})
    needs: [web, feed, licences]
    if: inputs.platforms != 'macos'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            mpv: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            mpv: aarch64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FEED: ${{ inputs.channel == 'nightly' && 'desktop-nightly' || 'desktop' }}
      CHANNEL: win-${{ matrix.arch }}${{ inputs.channel == 'nightly' && '-nightly' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: packages/jellyfin-web/dist-standalone

      - uses: actions/download-artifact@v8
        with:
          name: licences
          path: packages/desktop/licences

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop

      - name: Fetch libmpv
        run: ./packages/desktop/scripts/fetch-libmpv.ps1 -Arch ${{ matrix.mpv }}

      - name: Build the app
        working-directory: packages/desktop
        run: |
          # The workspace version is the first `version =` in Cargo.toml, whose
          # checkout may have CRLF endings.
          $toml = Get-Content Cargo.toml -Raw
          $toml = ([regex]'(?m)^version = "[^"]*"').Replace($toml, 'version = "${{ inputs.version }}"', 1)
          if ($toml -notmatch [regex]::Escape('version = "${{ inputs.version }}"')) { throw 'could not set the version' }
          Set-Content Cargo.toml $toml -NoNewline
          cargo build --release

      - name: Stage
        run: |
          $stage = New-Item -ItemType Directory -Force stage
          Copy-Item packages/desktop/target/release/aiostreams-desktop.exe $stage
          Copy-Item packages/desktop/vendor/${{ matrix.mpv }}/libmpv-2.dll $stage
          Copy-Item packages/desktop/THIRD-PARTY.md $stage
          Copy-Item packages/jellyfin-web/dist-standalone "$stage/web" -Recurse
          Copy-Item packages/desktop/licences/${{ matrix.target }}.html "$stage/third-party-licenses.html"

      - name: Pack
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $feed = "https://github.com/${{ github.repository }}/releases/download/$env:FEED/"
          # The last release, for a delta; the first build of a channel has none.
          vpk download http --url $feed --channel $env:CHANNEL -o releases
          if ($LASTEXITCODE -ne 0) { Write-Host 'No earlier release to build a delta from' }
          vpk pack --packId aiostreams-desktop --packVersion ${{ inputs.version }} `
            --packDir stage --mainExe aiostreams-desktop.exe --packTitle AIOStreams `
            --packAuthors AIOStreams --icon packages/desktop/app/icons/aiostreams.ico `
            --channel $env:CHANNEL --runtime win-${{ matrix.arch }} --outputDir releases
          if ($LASTEXITCODE -ne 0) { throw 'vpk pack failed' }
          $name = "aiostreams-desktop-$env:CHANNEL"
          Move-Item "releases/aiostreams-desktop-$env:CHANNEL-Setup.exe" "releases/$name.exe" -Force
          Move-Item "releases/aiostreams-desktop-$env:CHANNEL-Portable.zip" "releases/$name.zip" -Force

      - name: Publish to the feed
        run: |
          $version = [regex]::Escape('${{ inputs.version }}')
          $files = Get-ChildItem releases -File | Where-Object {
            $_.Name -like "*$env:CHANNEL*" -and ($_.Extension -ne '.nupkg' -or $_.Name -match "-$version-")
          }
          gh release upload $env:FEED $files.FullName --clobber
          # Only this channel's newest packages stay: an app further behind takes the full one.
          $kept = $files.Name
          $stale = gh release view $env:FEED --json assets --jq '.assets[].name' |
            Where-Object { $_ -match "-$([regex]::Escape($env:CHANNEL))-(full|delta)\.nupkg$" -and $_ -notin $kept }
          foreach ($asset in $stale) { gh release delete-asset $env:FEED $asset --yes }

      - name: Attach to the release
        if: ${{ inputs.release != '' }}
        run: gh release upload ${{ inputs.release }} "releases/aiostreams-desktop-$env:CHANNEL.exe" "releases/aiostreams-desktop-$env:CHANNEL.zip" --clobber

  macos:
    name: build (macOS ${{ matrix.arch }})
    needs: [web, feed, licences]
    if: inputs.platforms != 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      FEED: ${{ inputs.channel == 'nightly' && 'desktop-nightly' || 'desktop' }}
      CHANNEL: osx-${{ matrix.arch }}${{ inputs.channel == 'nightly' && '-nightly' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: packages/jellyfin-web/dist-standalone

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: actions/download-artifact@v8
        with:
          name: licences
          path: packages/desktop/licences

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop

      - name: Fetch libmpv
        run: ./packages/desktop/scripts/fetch-libmpv-macos.sh

      - name: Build the app
        working-directory: packages/desktop
        run: |
          # The workspace version is the first `version =` in Cargo.toml.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -q "^version = \"$VERSION\"" Cargo.toml
          cargo build --release
          cp licences/${{ matrix.target }}.html target/third-party-licenses.html

      - name: Assemble the app bundle
        run: ./packages/desktop/scripts/make-app-macos.sh "$VERSION" stage

      # Opens the app for a few seconds on the runner's own display and reads its log.
      - name: Smoke test
        run: |
          stage/AIOStreams.app/Contents/MacOS/aiostreams-desktop &
          pid=$!
          sleep 20
          kill "$pid" 2>/dev/null || true
          log=$(ls -t "$HOME/Library/Application Support/AIOStreams Desktop/logs/"*.log | head -1)
          cat "$log"
          grep -q "mpv started" "$log"
          grep -q "mpv render context ready" "$log"
          ! grep -q "panicked" "$log"

      - name: Pack
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"
          feed="https://github.com/${{ github.repository }}/releases/download/$FEED/"
          # The last release, for a delta; the first build of a channel has none.
          vpk download http --url "$feed" --channel "$CHANNEL" -o releases \
            || echo 'No earlier release to build a delta from'
          vpk pack --packId aiostreams-desktop --packVersion "$VERSION" \
            --packDir stage/AIOStreams.app --mainExe aiostreams-desktop --packTitle AIOStreams \
            --packAuthors AIOStreams --channel "$CHANNEL" --runtime osx-${{ matrix.arch }} \
            --outputDir releases
          ls -l releases
          name="aiostreams-desktop-$CHANNEL"
          mv releases/*"-$CHANNEL-Setup.pkg" "releases/$name.pkg"
          # Velopack adds its updater after the bundle was sealed. The installer is fine,
          # since installed files are not quarantined, but a downloaded zip is checked.
          portable=$(mktemp -d)
          ditto -x -k releases/*"-$CHANNEL-Portable.zip" "$portable"
          rm releases/*"-$CHANNEL-Portable.zip"
          bundle=$(find "$portable" -maxdepth 1 -name '*.app' | head -1)
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"
          ditto -c -k --keepParent "$bundle" "releases/$name.zip"

      - name: Publish to the feed
        run: |
          files=()
          for file in releases/*"$CHANNEL"*; do
            case "$file" in
              *.nupkg) [[ "$file" == *"-$VERSION-"* ]] || continue ;;
            esac
            files+=("$file")
          done
          gh release upload "$FEED" "${files[@]}" --clobber
          # Only this channel's newest packages stay: an app further behind takes the full one.
          gh release view "$FEED" --json assets --jq '.assets[].name' |
            grep -E -- "-${CHANNEL}-(full|delta)\.nupkg$" | while read -r asset; do
              keep=false
              for file in "${files[@]}"; do [[ "$(basename "$file")" == "$asset" ]] && keep=true; done
              $keep || gh release delete-asset "$FEED" "$asset" --yes
            done

      - name: Attach to the release
        if: ${{ inputs.release != '' }}
        run: gh release upload "${{ inputs.release }}" "releases/aiostreams-desktop-$CHANNEL.pkg" "releases/aiostreams-desktop-$CHANNEL.zip" --clobber
