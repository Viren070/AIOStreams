name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Trigger Docker Image Publish
        if: ${{ steps.release.outputs['release_created'] }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run --repo ${GITHUB_REPOSITORY} deploy-docker.yml -f ref=${TAG_NAME}

      - name: Trigger Desktop Release
        if: ${{ steps.release.outputs['packages/desktop--release_created'] }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs['packages/desktop--tag_name'] }}
        run: |
          gh workflow run --repo ${GITHUB_REPOSITORY} desktop-release.yml --ref ${TAG_NAME} -f tag=${TAG_NAME}

      # GitHub marks the newest release latest, and the README's release badge and link follow it.
      - name: Keep the server's release latest
        if: ${{ steps.release.outputs['packages/desktop--release_created'] || steps.release.outputs['packages/seanime-extensions--release_created'] }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo ${GITHUB_REPOSITORY} --exclude-pre-releases --json tagName --jq '[.[].tagName | select(startswith("v"))][0]')
          gh release edit --repo ${GITHUB_REPOSITORY} "$tag" --latest
