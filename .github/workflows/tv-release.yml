name: TV Release

# Started by the release workflow once release-please tags a tv-v* release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tv-v* tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/tv-build.yml
    with:
      release: ${{ inputs.tag }}
