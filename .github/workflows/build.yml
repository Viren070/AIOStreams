name: Build Addon

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - '!packages/desktop/**'
      - '!packages/docs/**'
      - '!packages/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tsconfig.json'
      - 'tsconfig.base.json'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install corepack
        run: corepack enable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Addon
        run: pnpm run build
